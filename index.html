
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha</title>

  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    h1 {
      color: #333;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 5px;
    }

    .cell {
      width: 100px;
      height: 100px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
    }

    .cell:hover {
      background: #ddd;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

  <h1>Jogo da Velha</h1>

  <p id="status">Vez do jogador: X</p>

  <div id="board"></div>

  <button onclick="reiniciar()">Reiniciar</button>

  <script>
    const board = document.getElementById('board');
    const status = document.getElementById('status');

    let vez = 'X';
    let jogadas = Array(9).fill('');
    let jogoFinalizado = false;

    const wins = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    function criarTabuleiro() {
      board.innerHTML = '';

      jogadas.forEach((val, i) => {
        const cell = document.createElement('div');

        cell.className = 'cell';
        cell.textContent = val;
        cell.onclick = () => jogar(i);

        board.appendChild(cell);
      });
    }

    function jogar(i) {
      if (jogadas[i] !== '' || jogoFinalizado) {
        return;
      }

      jogadas[i] = vez;

      const vencedor = verificarVencedor();

      criarTabuleiro();

      if (vencedor) {
        status.textContent = 'Vencedor: ' + vencedor + '!';
        jogoFinalizado = true;
        return;
      }

      if (jogadas.every(valor => valor !== '')) {
        status.textContent = 'Empate!';
        jogoFinalizado = true;
        return;
      }

      vez = vez === 'X' ? 'O' : 'X';

      status.textContent = 'Vez do jogador: ' + vez;
    }

    function verificarVencedor() {
      for (let p of wins) {
        if (
          jogadas[p[0]] &&
          jogadas[p[0]] === jogadas[p[1]] &&
          jogadas[p[0]] === jogadas[p[2]]
        ) {
          return jogadas[p[0]];
        }
      }

      return null;
    }

    function reiniciar() {
      jogadas = Array(9).fill('');
      vez = 'X';
      jogoFinalizado = false;

      status.textContent = 'Vez do jogador: X';

      criarTabuleiro();
    }

    criarTabuleiro();
  </script>

</body>
</html>
